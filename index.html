<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>WhaleNest</title>
  </head>
  <body>
    <div id="app">
      <main class="shell">

        <!-- 更新提示（检测到新版本 dsh 时显示） -->
        <div id="update-banner" class="update-banner" hidden>
          <span id="update-banner-text" class="update-banner-text"></span>
          <button id="btn-update" class="btn ghost" type="button">立即更新</button>
        </div>

        <!-- 加载中 -->
        <section id="view-loading" class="view" data-view="loading">
          <div class="brand" aria-hidden="true">
            <svg class="brand-mark" viewBox="0 0 120 72" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path class="wave wave--back" d="M10 22 C 26 10, 44 10, 58 22" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
              <path class="wave wave--mid" d="M10 38 C 30 22, 56 22, 72 36" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
              <path class="wave wave--front" d="M10 54 C 34 36, 66 36, 88 50" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
            </svg>
          </div>

          <div class="stage">
            <h1 class="view-title">正在启动 DeepSeek Harness…</h1>
            <p class="view-sub">首次启动可能需要一点时间，请稍候</p>
          </div>

          <div class="progress" role="progressbar" aria-label="正在启动">
            <span class="progress-bar"></span>
          </div>

          <p class="version">WHALENEST · v0.1.0</p>
        </section>

        <!-- 错误 -->
        <section id="view-error" class="view" data-view="error" hidden>
          <div class="status-icon status-icon--error" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="24" cy="24" r="20" stroke="currentColor" stroke-width="2.5" />
              <path d="M24 15.5 V 27" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
              <circle cx="24" cy="33.5" r="2" fill="currentColor" />
            </svg>
          </div>
          <h1 class="view-title">内核启动失败</h1>
          <p id="error-message" class="view-text error-message"></p>
          <button id="btn-restart" class="btn primary" type="button">重启内核</button>
        </section>

        <!-- 引导（未检测到 dsh） -->
        <section id="view-guide" class="view" data-view="guide" hidden>
          <div class="status-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M14 17 L 23 24 L 14 31" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M27 31 H 35" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" />
            </svg>
          </div>
          <h1 class="view-title">未检测到 dsh 内核</h1>
          <p class="view-text">
            WhaleNest 需要在后台运行 DeepSeek Harness（dsh）。
            当前未检测到 dsh，请先安装它：
          </p>
          <div class="code-block">
            <code>npm i -g @deepseek-ai/dsh</code>
            <button id="btn-copy-command" class="btn ghost" type="button">复制</button>
          </div>
          <p class="view-sub guide-sub">需要 Node.js 22 或更高版本。安装完成后，点击「重新检测」。</p>
          <button id="btn-redetect" class="btn primary" type="button">重新检测</button>
        </section>

      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

[package]
name = "whalenest"
version = "0.1.1"
description = "WhaleNest — a Tauri v2 desktop shell hosting the DeepSeek Harness (dsh) kernel"
authors = ["whalenest contributors"]
edition = "2021"

[lib]
name = "whalenest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "WhaleNest"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }


[features]
# Enable WebView DevTools so the "打开开发者工具" tray item works in RELEASE
# builds too (in debug it is already compiled in). Remove `devtools` from
# this list / build without --features devtools to harden a production release.
default = ["devtools"]
devtools = ["tauri/devtools"]

[dependencies]
# NOTE: tauri 2.x default features do NOT include "tray-icon" (verified against
# 2.11.5: default = wry, compression, common-controls-v6, dynamic-acl, x11, dbus).
# TrayIconBuilder requires it, and image-png/ico are needed to decode the tray
# and window icons, so they are listed explicitly here.
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
parking_lot = "0.12"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tokio = { version = "1", features = ["time"] }
